[project]
name = "thrift-walk-web"
revision = "1.0"

[providers]
env = "env://"
dotenv = "dotenv://"

[profiles.development]
POSTGRES_USER = { description = "Postgres Username", default = "postgres" }
POSTGRES_PASSWORD = { description = "Postgres Password", default = "db-password" }
POSTGRES_DB = { description = "Postgres Database", default = "postgres" }
DATABASE_URL = { description = "Database connection string", default = "postgresql://postgres:db-password@localhost:5432/postgres?schema=public" }

BETTER_AUTH_URL = { description = "BetterAuth URL", default = "http://localhost:9000" }
BETTER_AUTH_SECRET = { description = "BetterAuth secret", required = true, type = "base64", generate = { bytes = 64 }, providers = [
    "dotenv",
] }
GAME_SERVER_SECRET = { description = "Game Server secret", required = true, type = "base64", generate = { bytes = 64 }, providers = [
    "dotenv",
] }

# Browser origin and proxy listen ports. Keep BETTER_AUTH_URL in sync with PROXY_PORT.
PROXY_PORT = { description = "Local same-origin development proxy port", default = "9000" }
WEB_PORT = { description = "Next.js upstream port (start Next with this port)", default = "3000" }
GAME_PORT = { description = "Dedicated Godot WebSocket port", default = "8080" }
THRIFT_API_URL = { description = "Native game and dedicated-server API origin; must match Better Auth", default = "http://localhost:9000" }
THRIFT_GAME_URL = { description = "Native client WebSocket endpoint through the development proxy", default = "ws://localhost:9000/game-socket" }
MEDIA_ROOT = { description = "Durable image directory, relative to the web process working directory", default = ".media" }
RESET_EMAIL_WEBHOOK_URL = { description = "Optional password recovery delivery webhook", required = false }
RESET_EMAIL_WEBHOOK_SECRET = { description = "Optional recovery webhook bearer credential", required = false, providers = ["dotenv"] }

REDIS_URL = { description = "Redis connection string (3D scan job queue)", default = "redis://127.0.0.1:6379" }
SCAN_STORAGE_DIR = { description = "Absolute path where scan photos and .glb files are stored (shared by web and worker)", default = "/tmp/thriftwalk-scans" }
SCAN_APP_ORIGIN = { description = "Public HTTPS app origin; required for Runpod scans", required = false, providers = ["dotenv"] }
RUNPOD_API_KEY = { description = "Runpod endpoint invocation key; required for the Runpod dispatcher", required = false, providers = ["dotenv"] }
RUNPOD_ENDPOINT_ID = { description = "Runpod scan endpoint ID; required for the Runpod dispatcher", required = false, providers = ["dotenv"] }
SCAN_TRANSFER_SECRET = { description = "Shared web/dispatcher signing secret, at least 32 characters; required for Runpod scans", required = false, type = "base64", generate = { bytes = 64 }, providers = ["dotenv"] }

# GOOGLE_CLIENT_ID = { description = "Google OAuth client ID", required = true, providers = [
#     "dotenv",
# ] }
# GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret", required = true, providers = [
#     "dotenv",
# ] }

[profiles.production]
# Compose reads .env.production directly; SecretSpec is not required on the host.
POSTGRES_PASSWORD = { description = "Postgres Password", required = true }
DATABASE_URL = { description = "Database connection string", required = true }
BETTER_AUTH_URL = { description = "BetterAuth URL", required = true }
BETTER_AUTH_SECRET = { description = "BetterAuth secret", required = true }
REDIS_URL = { description = "Redis connection string (3D scan job queue)", required = true }
SCAN_STORAGE_DIR = { description = "Absolute path where scan photos and .glb files are stored (shared by web and worker)", required = true }
SCAN_APP_ORIGIN = { description = "Public HTTPS app origin; required for Runpod scans", required = false }
RUNPOD_API_KEY = { description = "Runpod endpoint invocation key; required for the Runpod dispatcher", required = false }
RUNPOD_ENDPOINT_ID = { description = "Runpod scan endpoint ID; required for the Runpod dispatcher", required = false }
SCAN_TRANSFER_SECRET = { description = "Shared web/dispatcher signing secret, at least 32 characters; required for Runpod scans", required = false }
# GOOGLE_CLIENT_ID = { description = "Google OAuth client ID", required = true }
# GOOGLE_CLIENT_SECRET = { description = "Google OAuth client secret", required = true }

GAME_SERVER_SECRET = { description = "Shared backend/dedicated-server credential; never export to clients", required = true }
MEDIA_ROOT = { description = "Absolute path to durable shared image storage", required = true }
THRIFT_API_URL = { description = "HTTPS API origin for the dedicated server and native clients", required = true }
THRIFT_ALLOW_INTERNAL_HTTP = { description = "Dedicated server only: permit HTTP API traffic on a private container network", default = "false" }
THRIFT_GAME_URL = { description = "Public WSS endpoint for native clients", required = true }
GAME_PORT = { description = "Dedicated server internal WebSocket listen port", default = "8080" }
RESET_EMAIL_WEBHOOK_URL = { description = "Password recovery email delivery endpoint", required = false }
RESET_EMAIL_WEBHOOK_SECRET = { description = "Recovery delivery bearer credential", required = false }
