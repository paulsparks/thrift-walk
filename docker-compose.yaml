name: thrift-walk

x-build: &build
  context: ./thrift-walk
  dockerfile: Dockerfile
  args:
    GODOT_VERSION: "4.7.2"

x-database-env: &database-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/configure.sh first}

x-app-env: &app-env
  <<: *database-env
  NODE_ENV: production
  BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.production}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run deploy/configure.sh first}
  GAME_SERVER_SECRET: ${GAME_SERVER_SECRET:?Run deploy/configure.sh first}
  MEDIA_ROOT: /data/media
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  RESET_EMAIL_WEBHOOK_URL: ${RESET_EMAIL_WEBHOOK_URL:-}
  RESET_EMAIL_WEBHOOK_SECRET: ${RESET_EMAIL_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      <<: *database-env
      POSTGRES_USER: thriftwalk
      POSTGRES_DB: thriftwalk
    volumes:
      - type: bind
        source: ${DATABASE_DIR:-./database}
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U thriftwalk -d thriftwalk']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: thrift-walk-tools:local
    build:
      <<: *build
      target: tools
    platform: linux/amd64
    environment: *database-env
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: thrift-walk-web:local
    build:
      <<: *build
      target: web
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment: *app-env
    volumes:
      - type: bind
        source: ${IMAGES_DIR:-./storage/images}
        target: /data/media
        bind:
          create_host_path: false
    networks:
      edge:
        aliases: [thrift-web]
      database:
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  game:
    image: thrift-walk-game:local
    build:
      <<: *build
      target: game
    platform: linux/amd64
    init: true
    restart: unless-stopped
    environment:
      GAME_SERVER_SECRET: ${GAME_SERVER_SECRET:?Run deploy/configure.sh first}
      GAME_PORT: "8080"
      THRIFT_API_URL: http://thrift-web:3000
      # Server-to-server requests only, over the private Compose network.
      THRIFT_ALLOW_INTERNAL_HTTP: "true"
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8080"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${PUBLIC_ORIGIN}}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      game:
        condition: service_healthy

  # Optional one-shot maintenance: docker compose --env-file .env.production run --rm cleanup
  cleanup:
    image: thrift-walk-tools:local
    build:
      <<: *build
      target: tools
    platform: linux/amd64
    profiles: [maintenance]
    environment:
      <<: *database-env
      MEDIA_ROOT: /data/media
    command: [pnpm, run, "media:cleanup"]
    volumes:
      - type: bind
        source: ${IMAGES_DIR:-./storage/images}
        target: /data/media
        bind:
          create_host_path: false
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  database:
    internal: true

volumes:
  caddy_data:
  caddy_config:
